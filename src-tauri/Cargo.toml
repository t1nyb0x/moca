[package]
name = "moca"
version = "0.5.0"
description = "VRM / PMX モデルと対話するデスクトップアプリ"
authors = ["t1nyb0x"]
license = ""
repository = "https://github.com/t1nyb0x/moca"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "moca_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ADR-0011: ロギングは tracing。ファイル出力とローテーションは段 8 で追加する。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# LLM 通信 (ADR-0002)。Windows では schannel より rustls のほうが依存が軽い。
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
  "http2",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
futures-util = "0.3"
bytes = "1"
async-trait = "0.1"
thiserror = "2"

# 機密は Windows 資格情報マネージャーへ (要件 F-11-1)
keyring = { version = "3", features = ["windows-native"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

# IPC の型は Rust 側を正とし、TS 側は生成する (docs/ipc-contract.md 1.2)
ts-rs = "12"
tauri-plugin-dialog = "2.7.2"
tracing-appender = "0.2.5"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
tempfile = "3"
