name: CI

# **取り込む前にだけ回す。** 同じ中身を二度検査しない。
#
# 変更は必ず PR を通して入る。feature から develop へ、develop から main へ。
# その二つの入口で確かめれば足りる。push でも回していたころは、版上げを push
# した時点で 1 回、その commit で PR を開いて 1 回、main へ取り込んでもう 1 回と、
# 同じ SHA を 3 度検査していた。
#
# main は Release ワークフローも守る。タグを打つ前に型チェックとテストを回し、
# 通らなければインストーラを作らない。
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # 配布対象が Windows のみなので、検証も Windows で行う (ADR-0006)。
    # Linux で通っても WebView2 の挙動は確かめられない。
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 依存の導入
        run: npm ci

      # 3 箇所の版番号がずれるとインストーラの版だけが古くなる
      - name: 版番号の一致
        run: npm run version:check

      - name: 型チェック
        run: npm run typecheck

      - name: Lint（レイヤ境界の強制を含む）
        run: npm run lint

      - name: フロントエンドのテストとカバレッジ
        run: npm run coverage

      # tauri-build が設定を読むため、先にフロントエンドを作っておく
      - name: フロントエンドのビルド
        run: npm run build

      - name: 書式
        working-directory: src-tauri
        run: cargo fmt --check

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # keyring を実際に触るテストは既定で除外される (#[ignore])
      - name: Rust のテスト
        working-directory: src-tauri
        run: cargo test --lib

      # cargo test が ts-rs の型を書き出す。差分が出るなら Rust 側の変更が
      # TypeScript 側へ反映されていない (docs/ipc-contract.md 1.2)。
      - name: IPC の型が最新か
        shell: bash
        run: |
          if ! git diff --exit-code -- src/ipc/generated; then
            echo "::error::IPC の型が古いままです。src-tauri で cargo test を実行し、生成物をコミットしてください。"
            exit 1
          fi

  # 実際に起動して疎通するかを確かめる。型やテストが通っても、WebView が
  # 立ち上がらない・IPC が繋がらないといった不具合は捕まえられない。
  # 実際そうした不具合を何度も出している。
  smoke:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: smoke

      - name: 依存の導入
        run: npm ci

      # cargo build ではなく tauri build を使う。前者の成果物は開発サーバー
      # を見にいくため単体で起動できない (README 参照)。
      - name: アプリのビルド
        run: npx tauri build --debug --no-bundle

      - name: 起動して疎通を確かめる
        run: npm run smoke
